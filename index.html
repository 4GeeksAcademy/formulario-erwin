<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Form</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white text-center fw-bold">
      Payment form example
    </div>
    <div class="card-body">

      <div class="alert alert-danger text-center" role="alert">
        Some fields are missing
      </div>

      <form>

        <div class="row mb-3">
            <div class="col-md-4">
              <label class="form-label">Card #</label>
              <input type="text" class="form-control" placeholder="XXXX XXXX XXXX XXXX">
            </div>
            <div class="col-md-4">
              <label class="form-label">CVC #</label>
              <input type="text" class="form-control" placeholder="123">
            </div>
            <div class="col-md-4">
              <label class="form-label">Amount</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="text" class="form-control" placeholder="Amount">
              </div>
            </div>
          </div>
  
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control">
            </div>
          </div>
  
          <div class="row mb-3">
            <div class="col-md-4">
              <label class="form-label">City</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">State</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Postal Code</label>
              <input type="text" class="form-control">
            </div>
          </div>

          <div class="row mb-4">
            <div class="col-md-6">
              <label class="form-label">We Accept:</label>
              <div class="d-flex align-items-center gap-2 mt-1">
                <img src="https://img.icons8.com/color/48/visa.png" alt="Visa" height="36">
                <img src="https://img.icons8.com/color/48/mastercard-logo.png" alt="Mastercard" height="36">
                <img src="https://img.icons8.com/color/48/amex.png" alt="Amex" height="36">
                <img src="https://img.icons8.com/color/48/bank-card-back-side.png" alt="Other" height="36">
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="3"></textarea>
            </div>
          </div>

          <div class="d-flex justify-content-end">
            <button type="reset" class="btn btn-secondary me-2">Cancel</button>
            <button type="submit" class="btn btn-primary">Send</button>
          </div>
        </form>
  
      </div>
    </div>
  </div>
  
  </body>
  </html>
